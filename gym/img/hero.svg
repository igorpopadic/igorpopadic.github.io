<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Duotone ilustracija teretane: crna + narandžasta. Mjesto za pravu fotografiju. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2522"/>
      <stop offset="1" stop-color="#141211"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ff5a1f" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#grid)"/>
  <rect width="800" height="1000" fill="url(#light)"/>

  <!-- svjetlo sa plafona -->
  <rect x="300" y="0" width="200" height="16" fill="#ff5a1f"/>
  <polygon points="300,16 500,16 680,700 120,700" fill="#ff5a1f" opacity="0.07"/>

  <!-- squat rack -->
  <g fill="#0b0a09" stroke="#ff5a1f" stroke-width="3">
    <rect x="170" y="200" width="34" height="620"/>
    <rect x="596" y="200" width="34" height="620"/>
    <rect x="150" y="190" width="500" height="26"/>
    <rect x="130" y="810" width="540" height="22"/>
  </g>
  <!-- rupice na stubovima -->
  <g fill="#ff5a1f" opacity="0.55">
    <circle cx="187" cy="260" r="4"/><circle cx="187" cy="300" r="4"/><circle cx="187" cy="340" r="4"/><circle cx="187" cy="380" r="4"/><circle cx="187" cy="420" r="4"/><circle cx="187" cy="460" r="4"/><circle cx="187" cy="500" r="4"/><circle cx="187" cy="540" r="4"/><circle cx="187" cy="580" r="4"/>
    <circle cx="613" cy="260" r="4"/><circle cx="613" cy="300" r="4"/><circle cx="613" cy="340" r="4"/><circle cx="613" cy="380" r="4"/><circle cx="613" cy="420" r="4"/><circle cx="613" cy="460" r="4"/><circle cx="613" cy="500" r="4"/><circle cx="613" cy="540" r="4"/><circle cx="613" cy="580" r="4"/>
  </g>
  <!-- držači -->
  <rect x="204" y="452" width="26" height="12" fill="#ff5a1f"/>
  <rect x="570" y="452" width="26" height="12" fill="#ff5a1f"/>

  <!-- šipka s tegovima -->
  <g>
    <rect x="40" y="436" width="720" height="12" rx="6" fill="#c9c3bc"/>
    <!-- lijevi tegovi -->
    <rect x="70" y="330" width="42" height="224" rx="8" fill="#0b0a09" stroke="#ff5a1f" stroke-width="3"/>
    <rect x="114" y="350" width="30" height="184" rx="6" fill="#0b0a09" stroke="#ff5a1f" stroke-width="3"/>
    <rect x="146" y="380" width="18" height="124" rx="4" fill="#ff5a1f"/>
    <!-- desni tegovi -->
    <rect x="688" y="330" width="42" height="224" rx="8" fill="#0b0a09" stroke="#ff5a1f" stroke-width="3"/>
    <rect x="656" y="350" width="30" height="184" rx="6" fill="#0b0a09" stroke="#ff5a1f" stroke-width="3"/>
    <rect x="636" y="380" width="18" height="124" rx="4" fill="#ff5a1f"/>
  </g>

  <!-- pod: gumene ploče -->
  <rect y="832" width="800" height="168" fill="#0b0a09"/>
  <g stroke="#2a2522" stroke-width="3">
    <line x1="0" y1="900" x2="800" y2="900"/>
    <line x1="200" y1="832" x2="200" y2="1000"/>
    <line x1="400" y1="832" x2="400" y2="1000"/>
    <line x1="600" y1="832" x2="600" y2="1000"/>
  </g>

  <!-- bučice na podu -->
  <g fill="#0b0a09" stroke="#ff5a1f" stroke-width="3">
    <rect x="250" y="860" width="22" height="50" rx="5"/>
    <rect x="272" y="878" width="70" height="14" fill="#c9c3bc" stroke="none"/>
    <rect x="342" y="860" width="22" height="50" rx="5"/>
    <rect x="440" y="866" width="18" height="40" rx="5"/>
    <rect x="458" y="880" width="56" height="12" fill="#c9c3bc" stroke="none"/>
    <rect x="514" y="866" width="18" height="40" rx="5"/>
  </g>

  <!-- kettlebell -->
  <g>
    <path d="M640 880 a40 40 0 1 0 80 0 a40 40 0 1 0 -80 0z" fill="#ff5a1f"/>
    <path d="M655 845 a25 25 0 0 1 50 0" fill="none" stroke="#ff5a1f" stroke-width="12"/>
    <text x="680" y="893" font-family="Arial Black, sans-serif" font-size="22" fill="#0b0a09" text-anchor="middle">24</text>
  </g>

  <!-- natpis na zidu -->
  <text x="400" y="140" font-family="Impact, Arial Black, sans-serif" font-size="64" fill="#ffffff" fill-opacity="0.06" text-anchor="middle" letter-spacing="8">HALL A</text>
</svg>
