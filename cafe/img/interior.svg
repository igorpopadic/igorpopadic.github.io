    <circle cx="1120" cy="515" r="10" fill="#2b1d16"/>
    <rect x="1030" y="545" width="20" height="25" fill="#2b1d16"/>
    <rect x="1110" y="545" width="20" height="25" fill="#2b1d16"/>
    <!-- šoljice -->
    <path d="M1250 560 h50 v18 a25 18 0 0 1 -50 0 z" fill="#f3e6d3"/>
    <path d="M1320 560 h50 v18 a25 18 0 0 1 -50 0 z" fill="#c8693f"/>
    <!-- tegla s kolačima -->
    <rect x="1420" y="500" width="110" height="85" rx="20" fill="#f3e6d3" opacity="0.5" stroke="#f3e6d3" stroke-width="3"/>
    <circle cx="1455" cy="560" r="18" fill="#c48a52"/>
    <circle cx="1495" cy="555" r="18" fill="#a86d3a"/>
  </g>

  <!-- sto i stolice -->
  <g>
    <ellipse cx="460" cy="700" rx="170" ry="26" fill="#3a2a22"/>
    <rect x="450" y="700" width="20" height="110" fill="#2b1d16"/>
    <ellipse cx="460" cy="815" rx="70" ry="12" fill="#2b1d16"/>
    <!-- šolja i tanjir na stolu -->
    <ellipse cx="400" cy="690" rx="40" ry="9" fill="#f3e6d3"/>
    <path d="M380 660 h40 v20 a20 12 0 0 1 -40 0 z" fill="#f3e6d3"/>
    <ellipse cx="520" cy="690" rx="55" ry="11" fill="#f3e6d3"/>
    <ellipse cx="520" cy="684" rx="30" ry="8" fill="#d99a5b"/>
    <!-- stolica -->
    <rect x="230" y="640" width="16" height="170" rx="6" fill="#5e3a25"/>
    <rect x="230" y="730" width="110" height="14" rx="6" fill="#5e3a25"/>
    <rect x="326" y="730" width="14" height="80" rx="6" fill="#5e3a25"/>
    <rect x="660" y="640" width="16" height="170" rx="6" fill="#5e3a25"/>
    <rect x="580" y="730" width="96" height="14" rx="6" fill="#5e3a25"/>
    <rect x="580" y="730" width="14" height="80" rx="6" fill="#5e3a25"/>
  </g>

  <!-- biljka u ćošku -->
  <g>
    <path d="M60 760 q-40 -160 20 -260" stroke="#6f8a5c" stroke-width="10" fill="none"/>
    <ellipse cx="40" cy="560" rx="45" ry="20" fill="#87a06c" transform="rotate(-30 40 560)"/>
    <ellipse cx="110" cy="610" rx="50" ry="20" fill="#6f8a5c" transform="rotate(25 110 610)"/>
    <ellipse cx="50" cy="660" rx="45" ry="18" fill="#9bb07f" transform="rotate(-20 50 660)"/>
    <ellipse cx="100" cy="520" rx="40" ry="16" fill="#9bb07f" transform="rotate(35 100 520)"/>
    <path d="M20 760 h100 l-15 80 h-70 z" fill="#c8693f"/>
  </g>
</svg>
