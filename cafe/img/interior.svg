<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d6bf"/>
      <stop offset="1" stop-color="#d9bc9a"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7c6"/>
      <stop offset="0.6" stop-color="#f6c99a"/>
      <stop offset="1" stop-color="#e9a877"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a3c"/>
      <stop offset="1" stop-color="#5e3a25"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a22"/>
      <stop offset="1" stop-color="#241812"/>
    </linearGradient>
    <radialGradient id="lampGlow">
      <stop offset="0" stop-color="#ffe2a8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe2a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.3">
      <stop offset="0" stop-color="#fff4dc" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff4dc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- zid -->
  <rect width="1600" height="900" fill="url(#wall)"/>
  <!-- svjetlost od prozora -->
  <ellipse cx="420" cy="380" rx="520" ry="420" fill="url(#sunGlow)"/>

  <!-- veliki lučni prozori -->
  <g>
    <path d="M150 640 V260 a140 140 0 0 1 280 0 V640 Z" fill="url(#sky)" stroke="#2b1d16" stroke-width="14"/>
    <line x1="290" y1="130" x2="290" y2="640" stroke="#2b1d16" stroke-width="8"/>
    <line x1="150" y1="400" x2="430" y2="400" stroke="#2b1d16" stroke-width="8"/>
    <path d="M490 640 V260 a140 140 0 0 1 280 0 V640 Z" fill="url(#sky)" stroke="#2b1d16" stroke-width="14"/>
    <line x1="630" y1="130" x2="630" y2="640" stroke="#2b1d16" stroke-width="8"/>
    <line x1="490" y1="400" x2="770" y2="400" stroke="#2b1d16" stroke-width="8"/>
    <!-- drveće napolju -->
    <circle cx="220" cy="560" r="70" fill="#9bb07f" opacity="0.7"/>
    <circle cx="350" cy="590" r="55" fill="#87a06c" opacity="0.7"/>
    <circle cx="600" cy="570" r="75" fill="#9bb07f" opacity="0.7"/>
    <circle cx="720" cy="600" r="50" fill="#87a06c" opacity="0.7"/>
  </g>

  <!-- polica s teglama -->
  <g>
    <rect x="900" y="300" width="560" height="14" rx="4" fill="#5e3a25"/>
    <rect x="900" y="440" width="560" height="14" rx="4" fill="#5e3a25"/>
    <rect x="930" y="230" width="50" height="70" rx="10" fill="#f3e6d3" stroke="#5e3a25" stroke-width="4"/>
    <rect x="930" y="270" width="50" height="30" fill="#6b4226"/>
    <rect x="1000" y="250" width="44" height="50" rx="8" fill="#f3e6d3" stroke="#5e3a25" stroke-width="4"/>
    <rect x="1000" y="275" width="44" height="25" fill="#c8693f"/>
    <circle cx="1100" cy="270" r="30" fill="#c8693f"/>
    <rect x="1150" y="220" width="36" height="80" rx="6" fill="#2b1d16"/>
    <rect x="1200" y="240" width="60" height="60" rx="30" fill="#8a9a7b"/>
    <path d="M1300 300 q20 -90 40 0 z" fill="#6f8a5c"/>
    <path d="M1330 300 q30 -110 50 0 z" fill="#87a06c"/>
    <rect x="1300" y="280" width="80" height="20" rx="4" fill="#c8693f"/>
    <rect x="940" y="370" width="70" height="70" rx="35" fill="#f3e6d3" stroke="#5e3a25" stroke-width="4"/>
    <rect x="1040" y="380" width="40" height="60" rx="6" fill="#6b4226"/>
    <rect x="1100" y="360" width="56" height="80" rx="10" fill="#f3e6d3" stroke="#5e3a25" stroke-width="4"/>
    <rect x="1100" y="400" width="56" height="40" fill="#3a2a22"/>
    <circle cx="1220" cy="410" r="30" fill="#8a9a7b"/>
    <rect x="1280" y="370" width="150" height="70" rx="8" fill="#2b1d16"/>
    <text x="1355" y="414" font-family="Georgia, serif" font-size="26" fill="#f3e6d3" text-anchor="middle">COFFEE</text>
  </g>

  <!-- viseće lampe -->
  <g>
    <line x1="1000" y1="0" x2="1000" y2="120" stroke="#2b1d16" stroke-width="4"/>
    <circle cx="1000" cy="170" r="140" fill="url(#lampGlow)"/>
    <path d="M960 120 h80 l20 50 h-120 z" fill="#2b1d16"/>
    <line x1="1220" y1="0" x2="1220" y2="90" stroke="#2b1d16" stroke-width="4"/>
    <circle cx="1220" cy="140" r="140" fill="url(#lampGlow)"/>
    <path d="M1180 90 h80 l20 50 h-120 z" fill="#2b1d16"/>
    <line x1="1440" y1="0" x2="1440" y2="130" stroke="#2b1d16" stroke-width="4"/>
    <circle cx="1440" cy="180" r="140" fill="url(#lampGlow)"/>
    <path d="M1400 130 h80 l20 50 h-120 z" fill="#2b1d16"/>
  </g>

  <!-- pod -->
  <rect y="760" width="1600" height="140" fill="url(#floor)"/>

  <!-- šank -->
  <g>
    <rect x="860" y="600" width="740" height="200" fill="url(#counter)"/>
    <rect x="840" y="585" width="780" height="22" rx="6" fill="#c8a27a"/>
    <!-- aparat za espresso -->
    <rect x="980" y="480" width="200" height="105" rx="14" fill="#b9bcc1"/>
    <rect x="995" y="495" width="170" height="40" rx="8" fill="#8d9096"/>
